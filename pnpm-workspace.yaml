# Jedna aplikacija u korenu repoa — nema `packages:` liste (ADR 0009, 0011).
# Fajl ostaje zbog podešavanja ispod, koja pnpm čita samo odavde.
# Obrazloženje verzija i namernih odstupanja od „najnovije": docs/16-tooling-ci.md §1.

# Build skripte se izvršavaju samo za pakete koje smo pogledali i odobrili.
# Novi paket koji traži build biće prijavljen pri instalaciji, ne tiho izvršen (docs/20-security.md).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true # bundler koji koriste tsx i vitest
  msw: true # postinstall kopira mockServiceWorker.js (potreban samo za browser mod)
  prisma: true
  unrs-resolver: true # native resolver za eslint-import-resolver-typescript
  # sharp je opciona zavisnost Next-a; slike se ne optimizuju u runtime-u
  # (images.unoptimized, docs/07-performance.md §6), pa se njegov build ne izvršava.
  sharp: false
  # Oba uvlači next-intl za izvlačenje poruka iz koda, koje ne koristimo (poruke su
  # ručno pisani constants/i18n/*.ts). Binarni fajlovi stižu kao prebuilt opcione
  # zavisnosti; install skripta im ne treba.
  '@parcel/watcher': false
  '@swc/core': false
