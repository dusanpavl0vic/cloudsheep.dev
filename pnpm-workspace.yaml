packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/config/*'

# Build skripte se izvršavaju samo za pakete koje smo pogledali i odobrili.
# Novi paket koji traži build biće prijavljen pri instalaciji, ne tiho izvršen (docs/20-security.md).
allowBuilds:
  esbuild: true # bundler koji koriste vite i vitest
  msw: true # postinstall kopira mockServiceWorker.js (potreban samo za browser mod)
  unrs-resolver: true # native resolver za eslint-import-resolver-typescript

# Jedna verzija za ceo monorepo. Paketi referišu sa "react": "catalog:".
# Promena verzije = izmena na jednom mestu.
# Obrazloženje pinova i dva namerna odstupanja od "najnovije": docs/16-tooling-ci.md §1
catalog:
  # ── Jezgro ──────────────────────────────────────────────────────────────
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@types/node': 26.2.0

  # TS 6, ne 7 — typescript-eslint peer je ">=4.8.4 <6.1.0" (docs/16 §1.5 A)
  typescript: 6.0.3

  vite: 8.2.1
  '@vitejs/plugin-react': 6.0.5
  '@rolldown/plugin-babel': 0.2.3
  # Babel 7, ne 8 — babel-plugin-react-compiler@1.0.0 je građen za @babel/types@7 i uz
  # Babel 8 tipovi se sudaraju (TS2344/TS7016). @rolldown/plugin-babel prihvata ^7.29.0.
  # Vidi docs/16-tooling-ci.md §1.6.
  '@babel/core': 7.29.7
  rolldown: 1.2.4
  # exact pin, bez ^ — compiler je nov, patch verzije menjaju ponašanje (ADR 0001)
  babel-plugin-react-compiler: 1.0.0

  # ── Aplikativni sloj ────────────────────────────────────────────────────
  react-router: 8.3.0
  '@reduxjs/toolkit': 2.12.0
  react-redux: 9.3.0
  tailwindcss: 4.3.3
  '@tailwindcss/vite': 4.3.3
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.6.0
  lucide-react: 1.31.0
  react-hook-form: 7.85.0
  zod: 4.4.3
  # 5.9.0 je objavljen isti dan kad je ovaj pin napravljen; pnpm-ova minimumReleaseAge
  # zaštita ga je uhvatila. Ne zaobilazimo je izuzetkom — uzimamo poslednju verziju
  # koja je prošla karantin. Vidi docs/16-tooling-ci.md §1.6.
  '@hookform/resolvers': 5.7.1
  i18next: 26.3.6
  react-i18next: 17.0.11
  i18next-icu: 2.4.4
  intl-messageformat: 11.2.13
  i18next-browser-languagedetector: 8.2.1
  sonner: 2.0.8
  date-fns: 4.4.0
  '@tanstack/react-virtual': 3.14.9
  '@radix-ui/react-dialog': 1.1.23
  '@radix-ui/react-slot': 1.3.3
  react-error-boundary: 6.1.3
  web-vitals: 6.1.1

  # ── Testiranje ──────────────────────────────────────────────────────────
  vitest: 4.1.10
  '@vitest/coverage-v8': 4.1.10
  '@vitest/ui': 4.1.10
  jsdom: 30.0.1
  '@testing-library/react': 16.3.2
  '@testing-library/user-event': 14.6.4
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/dom': 10.4.1
  msw: 2.15.0
  '@playwright/test': 1.62.1
  '@axe-core/playwright': 4.13.0
  # jest-axe umesto vitest-axe — vitest-axe je poslednji put objavljen 2022 (docs/16 §1.5 C)
  jest-axe: 11.0.0
  axe-core: 4.13.0
  '@types/jest-axe': 3.5.9

  # ── Lint, format ────────────────────────────────────────────────────────
  # ESLint 9, ne 10 — import i jsx-a11y staju na 9 (docs/16 §1.5 B)
  eslint: 9.39.5
  '@eslint/js': 9.39.5
  typescript-eslint: 8.67.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-import: 2.32.0
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-i18next: 6.1.5
  eslint-plugin-react-refresh: 0.5.4
  globals: 17.11.0
  prettier: 3.9.6
  prettier-plugin-tailwindcss: 0.8.1

  # ── Git hooks, release, budžeti ─────────────────────────────────────────
  husky: 9.1.7
  lint-staged: 17.3.0
  '@commitlint/cli': 21.2.2
  '@commitlint/config-conventional': 21.2.2
  '@changesets/cli': 3.0.0
  size-limit: 13.0.3
  '@size-limit/preset-app': 13.0.3
  '@lhci/cli': 0.15.1
  i18next-parser: 9.4.0
  turbo-ignore: 2.10.10
