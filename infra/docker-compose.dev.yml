# Baza za lokalni razvoj (`pnpm dev`, `pnpm test`):
#
#   docker compose -f infra/docker-compose.dev.yml up -d
#
# `appdb` — aplikacija (.env), `appdb_test` — Vitest projekat `db` (TEST_DATABASE_URL).
name: cloudsheep-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports: ['${DB_PORT:-5432}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev-init.sql:/docker-entrypoint-initdb.d/dev-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d appdb']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
