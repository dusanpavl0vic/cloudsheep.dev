# Bezbednosni headeri (docs/20-security.md §Headers).
#
# Zašto zaseban fajl: `add_header` u `location` bloku NE dopunjuje nego POTIRE sve
# `add_header` direktive nasleđene iz `server` bloka. Svaki `location` koji dodaje bilo
# kakav header mora da ponovi i ove — pa se uključuju kroz `include`, ne kopiraju.
#
# `__API_ORIGIN__` menja Dockerfile (`sed`) vrednošću build arg-a `VITE_API_URL`.
# Mora da se poklopi sa onim što app zaista zove, inače `connect-src` blokira svaki
# fetch i panel je mrtav bez ijedne poruke u mrežnom tabu — samo CSP greška u konzoli.
#
# Isti host stoji i u `img-src`, jer otpremljene slike i logotipi tehnologija stižu sa
# API porekla. NAPOMENA: ovo NIJE dovoljno samo po sebi — `helmet()` na API strani
# podrazumevano šalje `Cross-Origin-Resource-Policy: same-origin`, pa bi slika i sa
# ispravnim CSP-om bila odbijena. Zaglavlje se poništava u `routes/uploads.ts`.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: __API_ORIGIN__; font-src 'self'; connect-src 'self' __API_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# `style-src` ima `'unsafe-inline'` i to mora ostati: pet komponenti koristi `style={{ }}`
# (pozicije hero kartica, širine traka napretka, gradijenti). `script-src` je ostao strog —
# tamo `'unsafe-inline'` čini celu politiku besmislenom, i to je ono što Lighthouse meri.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS namerno NE postavljamo ovde. `.dev` je na HSTS preload listi pretraživača, pa
# HTTP na ovom domenu ionako ne postoji, a Traefik ispred nas već terminira TLS.
