# nginx config za obe SPA app-e (`web` i `admin`).
#
# Preuzima ono što je ranije radila hostovana platforma (`rewrites` + `headers`).
# Razlike koje postoje između app-a rešavaju
# `sed` zamene u Dockerfile-u, ne dva odvojena fajla:
#   __API_ORIGIN__  → vrednost build arg-a VITE_API_URL (u security-headers.conf)
#   # __ROBOTS__    → `add_header X-Robots-Tag`, u `security-headers.conf`

# `www.cloudsheep.dev` i `cloudsheep.dev` su za pretraživač dva sajta sa istim sadržajem.
# Bez ovoga oba vraćaju 200 i Google bira sam koji je „pravi" — a `canonical` i `sitemap.xml`
# govore verziju bez `www`.
#
# Domen se čita iz zahteva, pa isti fajl radi i za `web` i za `admin` bez ijedne `sed` zamene.
#
# `_` u bloku ispod NIJE džoker — to je ime koje se nikad ne poklapa. Zahtev čiji `Host` ne
# uhvati nijedno ime zato ne pada na taj blok nego na DEFAULT SERVER, a to je bez izričite
# oznake prvi blok deklarisan za `listen 80`. Ovaj, sa redirekcijom.
#
# Health check pogađa `http://127.0.0.1/healthz`, dakle `Host: 127.0.0.1`, koji ne odgovara
# ni `www.` regexu ni `_`. Bez `default_server` ispod, on je završavao ovde: `$domain` je
# prazan jer regex nije upalio, pa je odgovor bio 301 na `https:///healthz`. Kontejner je
# rušio deploy jer wget na tom URL-u puca, a ne zato što nginx ne radi.
server {
  listen 80;
  server_name ~^www\.(?<domain>.+)$;
  return 301 https://$domain$request_uri;
}

# `default_server`: sve što nije `www.*` servira SPA — uključujući health check po IP-u.
server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Traefik je ispred nas i on radi TLS; ovde ne treba redirect ni sertifikat.
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml application/xml;

  include /etc/nginx/conf.d/security-headers.conf;

  # Hešovani Vite izlaz — ime se menja sa sadržajem, pa je `immutable` bezbedno.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
  }

  # Fontovi NEMAJU heš u imenu (`dm-sans-latin.woff2`). Keširaju se isto agresivno jer se
  # praktično ne menjaju — posledica: promena fonta traži promenu imena fajla, inače je
  # posetioci sa keširanom verzijom neće videti godinu dana.
  location /fonts/ {
    include /etc/nginx/conf.d/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    access_log off;
  }

  # Skriveni fajlovi se ne serviraju. `public/` ume da pokupi `.DS_Store` i on završi
  # u `dist`-u — ovo je zaštita od tog previda, ne od napada.
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # SPA fallback — zamena za `rewrites` hostovane platforme. `try_files` prvo traži pravi
  # fajl, pa tek
  # onda vraća index.html. Zato `robots.txt` i `sitemap.xml` moraju POSTOJATI kao fajlovi:
  # bez njih bi crawler na `/robots.txt` dobio HTML i svaku liniju prijavio kao grešku.
  location / {
    # `$uri.html` PRE `$uri/`: `scripts/build-seo-pages.mjs` piše `projects.html` i
    # `projects/booksphere.html` sa naslovom i opisom po ruti. Bez ovog koraka nginx bi za
    # `/projects` našao istoimeni folder i vratio 301 na `/projects/` — a `canonical` i
    # sitemap govore adresu bez kose crte.
    try_files $uri $uri.html $uri/ /index.html;
  }

  # index.html se NE keširа. On je jedini fajl koji zna koja je trenutna verzija
  # hešovanih assetova — keširan, zaključava posetioca na stari build.
  location = /index.html {
    include /etc/nginx/conf.d/security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Docker/Coolify health check. Namerno ne dira ništa osim nginx-a samog.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
