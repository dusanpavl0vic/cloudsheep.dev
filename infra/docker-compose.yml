# SAMO za lokalnu proveru produkcionog image-a (na serveru ga ne čita niko — Coolify,
# infra/COOLIFY.md):
#
#   docker build -t cloudsheep:local .
#   export JWT_SECRET=$(openssl rand -hex 24) SEED_ADMIN_PASSWORD=$(openssl rand -hex 12)
#   docker compose -f infra/docker-compose.yml up
#
# Tajne se ne pišu u fajl (skener tajni, i navika): compose ih uzima iz okruženja i odbija
# start bez njih. Admin nalog: admin@cloudsheep.local + $SEED_ADMIN_PASSWORD.
#
# Provera posle podizanja:
#   curl -s localhost:3000/api/health/ready   → {"status":"ok","database":"up"}
#   open http://localhost:3000                → sajt;  /admin → admin
#   open http://localhost:8025                → Mailpit: mejlovi potvrde i obaveštenja
#   docker stats cloudsheep-app               → memorija pod opterećenjem (cilj < 300 MB)

name: cloudsheep-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d appdb']
      interval: 5s
      timeout: 3s
      retries: 10

  # Lažni SMTP: prima sve, ništa ne šalje dalje. Mejlovi se vide na :8025.
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports: ['${MAILPIT_PORT:-8025}:8025']

  app:
    image: ${APP_IMAGE:-cloudsheep:local}
    container_name: cloudsheep-app
    # Isto ograničenje kao na serveru (infra/COOLIFY.md) — curenje memorije se vidi ovde.
    mem_limit: 768m
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/appdb
      # `:?` — bez promenljive u okruženju compose odbija start (vidi uputstvo na vrhu).
      JWT_SECRET: ${JWT_SECRET:?}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: studio@cloudsheep.local
      # Mailpit prihvata bilo koju prijavu; vrednost samo mora da postoji.
      SMTP_PASS: mailpit
      CONTACT_TO: studio@cloudsheep.local
      SEED_ADMIN_EMAIL: admin@cloudsheep.local
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?}
    volumes: [uploads:/app/uploads]
    ports: ['${APP_PORT:-3000}:3000']
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }

volumes:
  pgdata:
  uploads:
