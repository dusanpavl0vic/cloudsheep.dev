name: CI

on:
  push:
    branches: [dev, main, prod]
  pull_request:
    branches: [dev, main, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # turbo --filter=[origin/dev] treba istoriju da bi znao šta je promenjeno
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:cov

      - name: Build
        run: pnpm build

      - name: Bundle budžeti
        run: pnpm size

  # Deploy radi Coolify preko webhooka; ovde se samo proverava da se image-i uopšte grade.
  # Bez ovoga se pokvaren Dockerfile otkriva tek posle push-a u `prod`, na serveru.
  docker:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, admin]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          # Koren repoa, ne `apps/<app>` — Dockerfile-ovi kopiraju lockfile i workspace fajl.
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: false
          build-args: |
            VITE_API_URL=https://api.cloudsheep.dev
            VITE_APP_ENV=production
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--filter web` je obavezan: Playwright je zavisnost te app-e, pa mu binarni fajl
      # stoji u `apps/web/node_modules/.bin`, a `pnpm exec` iz korena tamo ne gleda —
      # zbog toga je e2e posao padao sa `Command "playwright" not found`.
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/*/playwright-report/
          retention-days: 7
