name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Aplikacija i e2e: prava baza (seed), lažni SMTP (Mailpit) — ceo double opt-in tok.
  # Postgres u CI kontejneru je bez lozinke (trust); tajne (JWT, admin, SMTP) se generišu
  # po pokretanju u koraku „Tajne za ovo pokretanje" — u repou nema nijedne vrednosti.
  DATABASE_URL: postgresql://app@localhost:5432/appdb
  TEST_DATABASE_URL: postgresql://app@localhost:5432/appdb_test
  SMTP_HOST: localhost
  SMTP_PORT: 1025
  SMTP_USER: studio@cloudsheep.test
  CONTACT_TO: studio@cloudsheep.test
  MAILPIT_URL: http://localhost:8025
  SEED_ADMIN_EMAIL: admin@cloudsheep.test
  NEXT_PUBLIC_SITE_URL: https://cloudsheep.dev
  NEXT_PUBLIC_APP_ENV: production

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_DB: appdb
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d appdb" --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports: ['1025:1025', '8025:8025']

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tajne za ovo pokretanje
        run: |
          for name in JWT_SECRET SEED_ADMIN_PASSWORD SMTP_PASS; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Baze (aplikacija + test)
        run: |
          psql -h localhost -U app -d appdb -c 'CREATE DATABASE appdb_test'
          pnpm db:deploy
          pnpm db:seed

      - run: pnpm typecheck
      - run: pnpm lint
      - name: Test (unit + baza)
        run: pnpm test

      - run: pnpm build

      - name: Playwright (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: JS budžet po javnoj ruti
        run: pnpm size

      - name: E2E
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Image se gradi OVDE, nikad na VPS-u (4 GB), i pokreće (smoke test) pre objave. Na push u
  # dev/prod ide na GHCR sa tagom grane (`:dev`, `:prod`) i `sha-…`; Coolify povlači `:prod`
  # (infra/COOLIFY.md). Na PR-u se gradi i pokreće, ali ne objavljuje.
  image:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      # 1) Build u lokalni Docker (amd64), da bi se image pokrenuo pre objave.
      - uses: docker/build-push-action@v6
        with:
          context: .
          # VPS je amd64.
          platforms: linux/amd64
          load: true
          tags: cloudsheep:ci
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://cloudsheep.dev
            NEXT_PUBLIC_APP_ENV=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Image se POKREĆE kao na serveru: prazna baza, mem 768m, start skripta
      #    (migracije → seed → server). e2e ide kroz `next start`, ne kroz image — bez ovoga
      #    pad seed-a ili migracije u kontejneru vidi se tek na produkciji.
      - name: Smoke test image-a (migracije, seed, start, 768m)
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_USER=app -e POSTGRES_DB=appdb \
            -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          until docker exec db pg_isready -U app -d appdb >/dev/null 2>&1; do sleep 1; done
          docker run -d --name app --network smoke --memory=768m -p 3000:3000 \
            -e DATABASE_URL=postgresql://app@db:5432/appdb \
            -e JWT_SECRET="$(openssl rand -hex 24)" \
            -e SEED_ADMIN_EMAIL=admin@ci.test -e SEED_ADMIN_PASSWORD="$(openssl rand -hex 12)" \
            cloudsheep:ci
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health/ready >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          docker logs app
          [ -n "$ok" ] || { echo "::error::Kontejner nije spreman (vidi log iznad)"; exit 1; }
          docker logs app 2>&1 | grep -q "seed: admin admin@ci.test spreman" || { echo "::error::Seed nije napravio admin nalog"; exit 1; }
          for path in / /projects /notes /contact /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "$path → $code"; [ "$code" = 200 ] || exit 1
          done
          docker stats --no-stream app

      # 3) Objava na GHCR (samo push u dev/prod) — isti build iz keša.
      - uses: docker/build-push-action@v6
        if: github.event_name == 'push'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://cloudsheep.dev
            NEXT_PUBLIC_APP_ENV=production
          cache-from: type=gha

  # Produkcija: posle novog `:prod` image-a Coolify ga povlači i restartuje (webhook resursa).
  # Secrets COOLIFY_WEBHOOK i COOLIFY_TOKEN postavlja vlasnik (infra/COOLIFY.md §5); bez njih
  # korak se preskače, a deploy se pokreće ručno u Coolify-ju.
  deploy:
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    environment: production
    steps:
      - name: Coolify deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::notice::COOLIFY_WEBHOOK/COOLIFY_TOKEN nisu postavljeni — deploy pokreni ručno u Coolify-ju."
            exit 0
          fi
          curl --fail --silent --show-error -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
