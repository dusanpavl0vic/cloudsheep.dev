name: CI

on:
  push:
    branches: [dev, main, prod]
  pull_request:
    branches: [dev, main, prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # turbo --filter=[origin/dev] treba istoriju da bi znao šta je promenjeno
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:cov

      - name: Build
        run: pnpm build

      - name: Bundle budžeti
        run: pnpm size

  # Deploy radi Coolify preko webhooka; ovde se samo proverava da se image-i uopšte grade.
  # Bez ovoga se pokvaren Dockerfile otkriva tek posle push-a u `prod`, na serveru.
  docker:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, admin]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          # Koren repoa, ne `apps/<app>` — Dockerfile-ovi kopiraju lockfile i workspace fajl.
          context: .
          file: infra/docker/${{ matrix.app }}.Dockerfile
          push: false
          build-args: |
            VITE_API_URL=https://api.cloudsheep.dev
            VITE_APP_ENV=production
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  # E2E se NE vozi u CI-ju — pušta se lokalno sa `pnpm e2e`.
  #
  # `apps/web` loaderi dohvataju projekte, tehnologije, profil i tim sa API-ja PRE rendera,
  # bez fallback-a: kad API ne odgovara, i početna strana ode na `errorElement`. U CI-ju API
  # ne postoji, pa je padalo svih 23 testa — 19 minuta po pokretanju, bez ijedne korisne
  # informacije. Lokalno prolaze jer `apps/web/.env` postoji na mašini (gitignore-ovan).
  #
  # Da se vrate ovde, treba jedno od dvoga, i to je odluka a ne propust:
  #   • Playwright `page.route()` koji presreće API pozive i vraća fiksne podatke
  #     (hermetično, brzo, ne traži ni bazu ni `api`), ili
  #   • Postgres servis + pokrenut `api` u ovom poslu (testira pravi stack, ali sporo
  #     i pada kad padne bilo šta u API-ju).
  #
  # `docker` posao iznad ostaje jedina provera koja stvarno gradi ono što gradi Coolify.
