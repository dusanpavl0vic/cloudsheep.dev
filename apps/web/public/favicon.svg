<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
<!-- Favicon javnog sajta: marka u belom krugu.

     Marka, ne wordmark: raniji favicon je bio ceo logotip sa rečju „cloudsheep", što je na
     16px bila mrlja.

     Linije marke su RUPE i izrezuje ih MASKA. `fill-rule="evenodd"` daje isti rezultat dok
     se linije ne preklope; tamo se parnost okrene i rupa zapuši.

     BEZ obruba koji marka nosi u app-i. Tamo obrub odvaja plohu od skoro bele strane; ovde
     je marka već na belom krugu, a na 16px bi samo zamutio oblik.

     Marka zauzima 124 od 160 (77% prečnika). Više od toga i dodiruje ivicu kruga —
     provereno renderom na 104 / 124 / 138.

     Beli krug je opaque, pa ikona radi i na tamnom hromu pretraživača; zato ovde nema
     `prefers-color-scheme`.

     Geometrija marke je ISTA kao u `packages/ui/src/atoms/Logo/SheepMark.tsx`; menja se na
     sva tri mesta. -->
