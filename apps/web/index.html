<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="One-person product studio: design, web and mobile apps from a single pair of hands. No handoffs, one owner from first sketch to launch."
    />
    <meta name="theme-color" content="#f8f8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1f45" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Društvene oznake — samo one koje su ISTE na svakoj ruti.
      `canonical` i `og:url` NAMERNO nisu ovde: statična vrednost bi važila za svaku rutu i
      rekla pretraživaču da su /projects, /contact i /uses duplikati početne, pa bi ih
      izbacila iz indeksa. Njih po ruti postavlja `useDocumentHead`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CloudSheep" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="sr_RS" />
    <meta property="og:title" content="CloudSheep — product studio from Niš" />
    <meta
      property="og:description"
      content="One-person product studio: design, web and mobile apps from a single pair of hands. No handoffs, one owner from first sketch to launch."
    />
    <meta property="og:image" content="https://cloudsheep.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CloudSheep — a sheep whose body is a cloud" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fontovi za prvi ekran: preload da ne kasne iza CSS-a (LCP je hero naslov) -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <title>CloudSheep — product studio from Niš</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
