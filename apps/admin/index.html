<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Opis je interni, ne marketinški: ovo je panel iza prijave. Ranije je ovde stajao
         tekst javnog sajta, prekopiran zajedno sa ostatkom fajla. Indeksiranje ionako
         gasi `X-Robots-Tag` iz `infra/docker/admin.Dockerfile`. -->
    <meta name="description" content="CloudSheep — interni panel za upravljanje sadržajem sajta." />
    <meta name="theme-color" content="#f8f8f5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preload da fontovi ne kasne iza CSS-a. Do sada su oba bila 404: `apps/admin`
         uopšte nije imao `public/`, pa ni fontove — panel je crtao `Segoe UI`, iako
         tokeni traže Space Grotesk i DM Sans. -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <title>CloudSheep Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
